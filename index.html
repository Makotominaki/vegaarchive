<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vega · Archive</title>
<style>
:root{--red:#e11d2e;--glass:rgba(12,12,16,.74);--card:#111214e8;--box:#1e1f22;--tx:#f2f3f5;--mut:#a3a6ad}
@media (orientation:portrait){:root{--red:#ff2a3d;--glass:rgba(34,6,10,.78);--card:#1c070bea;--box:#2e0c12;--mut:#e0a9ae}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#05050a;color:var(--tx);font-family:"Noto Sans Thai","Segoe UI",system-ui,sans-serif;touch-action:manipulation;user-select:none}
svg{display:block}
/* backgrounds: landscape = video, portrait = red animated */
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(.6) saturate(1.15)}
#bgp{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(.62) saturate(1.2);display:none}
@media (orientation:portrait){#bg{display:none}#bgp{display:block}}
.shade{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,.7)),linear-gradient(#0009,#0000 28%)}
#fx{position:fixed;inset:0;z-index:2;pointer-events:none}
#root{position:fixed;inset:0;z-index:3;opacity:0;transform:scale(1.05);transition:opacity 1s .3s,transform 1s .3s}
.in #root{opacity:1;transform:none}
/* enter screen */
#enter{position:fixed;inset:0;z-index:50;display:grid;place-items:center;cursor:pointer;background:radial-gradient(circle at 50% 45%,#3a050ce8,#060205f4 72%);transition:transform .9s cubic-bezier(.7,0,.3,1),opacity .9s,filter .9s}
#mtog{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;z-index:3;width:auto;height:38px;border-radius:99px;padding:0 15px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.14em;background:#0009;border:1px solid #ffffff2a;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff}
#mtog.off{color:#ff7a85;border-color:#ff2a3d66}
#enter.go{transform:scale(1.5);opacity:0;filter:blur(14px);pointer-events:none}
#enter::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#0006 3px 4px);pointer-events:none}
.en{text-align:center;position:relative;z-index:2;padding:0 16px}
.en .av{--sz:min(40vw,34vh,180px);margin:0 auto 14px}
.en-n{font-size:clamp(20px,5vw,30px);font-weight:800}
.en-u{font-size:13px;color:var(--mut);margin:2px 0 26px;letter-spacing:.05em}
.en h2{margin:0;font-size:clamp(22px,6.2vw,48px);font-weight:900;letter-spacing:.22em;padding-left:.22em;text-shadow:2px 0 #ff2b3d,-2px 0 #3fd9ff;animation:gl 2.4s infinite}
@keyframes gl{0%,90%,100%{text-shadow:2px 0 #ff2b3d,-2px 0 #3fd9ff;transform:none}93%{text-shadow:-6px 0 #ff2b3d,6px 0 #3fd9ff;transform:skewX(8deg)}96%{text-shadow:6px 0 #ff2b3d,-6px 0 #3fd9ff;transform:skewX(-6deg)}}
.en p{margin:16px 0 0;font-size:13px;letter-spacing:.3em;color:#ff7a85;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.15}}
.en::before,.en::after{content:"";position:absolute;left:50%;width:min(70vw,520px);height:2px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--red),transparent)}
.en::before{top:-26px}.en::after{bottom:-26px}
/* avatar (shared) */
.av{--sz:88px;position:relative;width:var(--sz);height:var(--sz)}
.av img.a{position:absolute;inset:9.1%;width:81.8%;height:81.8%;border-radius:50%;object-fit:cover;background:#222}
.av img.f{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.av.noframe::before{content:"";position:absolute;inset:3.4%;border-radius:50%;background:conic-gradient(var(--red),#ff9aa3,#6a0710,var(--red));animation:spin 6s linear infinite;box-shadow:0 0 22px #e11d2e88}
.av.noframe img.a{inset:7.9%;width:84.2%;height:84.2%;border:3px solid #130608}
.dot{position:absolute;right:6%;bottom:6%;width:25%;height:25%;border-radius:50%;background:#80848e;border:4px solid #130608;transition:.3s}
.dot.online{background:#23a55a;box-shadow:0 0 10px #23a55a}.dot.idle{background:#f0b232}.dot.dnd{background:#f23f43}
/* top bar */
.bar{position:fixed;top:0;left:0;right:0;height:22px;z-index:6;cursor:pointer;touch-action:none}
.bar .tr{position:absolute;top:0;left:0;right:0;height:8px;background:#2a0409;transition:height .2s}
.bar .fl{position:absolute;top:0;left:0;height:8px;width:0;background:linear-gradient(90deg,#8a0a16,var(--red) 70%,#ff5563);box-shadow:0 0 14px var(--red);clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:height .2s}
.bar:hover .tr,.bar:hover .fl,.bar.drag .tr,.bar.drag .fl{height:12px}
.time{position:fixed;top:16px;left:12px;z-index:6;font:700 12px/1 monospace;letter-spacing:.08em;color:#ff7a85;text-shadow:0 0 8px var(--red)}
/* player */
.player{position:fixed;top:24px;right:10px;z-index:6;width:min(330px,calc(100vw - 20px));display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:16px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ffffff1a;box-shadow:0 6px 24px #0008}
.disc{flex:none;width:46px;height:46px;border-radius:50%;background:var(--cover) center/cover;position:relative;box-shadow:0 0 0 2px #000,0 0 12px #e11d2e66;animation:spin 4s linear infinite;animation-play-state:paused}
.disc.on{animation-play-state:running}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,#0000 0 3px,#0003 3px 4px)}
.disc i{position:absolute;inset:38%;border-radius:50%;background:#0b0b0e;box-shadow:0 0 0 2px #444}
@keyframes spin{to{transform:rotate(360deg)}}
.meta{flex:1;min-width:0;line-height:1.25}
.meta b,.meta span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{font-size:14px}.meta span{font-size:11px;color:var(--mut)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:#ffffff14;border-radius:50%;width:36px;height:36px;flex:none;display:grid;place-items:center;transition:.2s}
button:hover{background:var(--red);transform:scale(1.08)}
.vol{display:flex;align-items:center;gap:2px}.vol button{width:28px;height:28px;background:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:64px;height:4px;border-radius:4px;background:#ffffff30;outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--red)}
/* pages */
.pgw{position:absolute;inset:0;display:grid;place-items:center;padding:84px 12px 78px;opacity:0;transform:translateX(50px) scale(.96);filter:blur(8px);pointer-events:none;transition:opacity .5s,transform .55s cubic-bezier(.2,.8,.2,1),filter .5s}
.pgw.l{transform:translateX(-50px) scale(.96)}
.pgw.act{opacity:1;transform:none;filter:none;pointer-events:auto}
.sc{width:100%;max-height:100%;overflow-y:auto;scrollbar-width:none;display:grid;justify-items:center}.sc::-webkit-scrollbar{display:none}
/* nav */
.nav{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;display:flex;gap:4px;padding:5px;border-radius:99px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ffffff1a;box-shadow:0 8px 28px #000a}
.nv{width:auto;height:40px;border-radius:99px;padding:0 18px;display:flex;align-items:center;gap:8px;font:700 12px/1 inherit;letter-spacing:.12em;background:none;color:var(--mut)}
.nv.act{background:var(--red);color:#fff;box-shadow:0 0 18px #e11d2e88}
/* profile card */
.card{width:min(380px,100%);border-radius:20px;background:var(--card);position:relative;box-shadow:0 20px 60px #000a,0 0 50px #e11d2e30;transition:transform .15s}
.card::before{content:"";position:absolute;inset:0;border-radius:20px;padding:1.5px;background:conic-gradient(from var(--a,0deg),#e11d2e,#ffffff10 25%,#ff7a85 50%,#ffffff10 75%,#e11d2e);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot 5s linear infinite;pointer-events:none;z-index:3}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes rot{to{--a:360deg}}
.banner{height:132px;background:linear-gradient(#0000 50%,#130608cc),var(--banner) 30% center/cover #3a0a10;position:relative;border-radius:20px 20px 0 0;overflow:hidden}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff2a 50%,transparent 60%);background-size:250% 100%;animation:shine 4s infinite}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
.pad{padding:8px 16px 16px}.pad .av{margin:-44px 0 0 0}
h1{margin:0;font-size:22px;line-height:1.2}
.un{color:var(--mut);font-size:13px;margin:2px 0 8px}
.st{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:4px 11px;border-radius:99px;background:#ffffff14;margin-bottom:12px}
.st i{width:8px;height:8px;border-radius:50%;background:#80848e}
.st.online i{background:#23a55a;box-shadow:0 0 8px #23a55a}.st.idle i{background:#f0b232}.st.dnd i{background:#f23f43}
.box{background:var(--box);border-radius:12px;padding:12px;min-height:74px;display:flex;gap:12px;align-items:center}
.box small{display:block;font-size:10px;letter-spacing:.1em;color:var(--mut);margin-bottom:3px}
.box .tx{min-width:0;flex:1;font-size:13px;line-height:1.35}
.tx b,.tx span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx span{color:var(--mut);font-size:12px}
.sd{flex:none;width:58px;height:58px;border-radius:50%;background:#333 center/cover;position:relative;box-shadow:0 0 0 2px #000;animation:spin 4s linear infinite}
.sd i{position:absolute;inset:39%;border-radius:50%;background:var(--box);box-shadow:0 0 0 2px #555}
.pg{height:4px;background:#ffffff22;border-radius:4px;margin-top:6px;overflow:hidden}.pg div{height:100%;width:0;background:#1db954}
/* contact page */
.cl{width:min(440px,100%);display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--card);border:1px solid #ffffff14;box-shadow:0 8px 24px #0006;opacity:0}
.act .row{animation:rowin .55s calc(var(--i)*70ms + .15s) cubic-bezier(.2,.9,.3,1) both}
@keyframes rowin{from{opacity:0;transform:translateX(40px)}to{opacity:1}}
.app{flex:none;width:50px;height:50px;border-radius:23%;display:grid;place-items:center;box-shadow:0 6px 16px #0008,inset 0 0 0 1px #ffffff22;transition:.25s}
.row:hover .app{transform:rotate(-6deg) scale(1.1)}
.rt{flex:1;min-width:0;line-height:1.3}
.rt b,.rt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rt b{font-size:14px}.rt span{font-size:12px;color:var(--mut)}
.btns{display:flex;gap:6px}
.mini{width:auto;height:34px;border-radius:10px;padding:0 11px;display:flex;align-items:center;gap:6px;font:700 11px/1 inherit;letter-spacing:.07em;color:#fff;text-decoration:none;background:#ffffff16;transition:.25s}
.mini:hover{background:var(--red);transform:translateY(-2px)}
.mini.ok{background:#23a55a;animation:pop .45s}
@keyframes pop{40%{transform:scale(1.18) rotate(-3deg)}}
/* click fx */
.rip{position:fixed;z-index:60;width:16px;height:16px;margin:-8px;border-radius:50%;border:2px solid #ff4455;box-shadow:0 0 12px #e11d2e,inset 0 0 8px #e11d2e;pointer-events:none;animation:rip .7s ease-out forwards}
.rip.b{animation-delay:.12s;opacity:0}
@keyframes rip{from{opacity:1}to{transform:scale(6);opacity:0}}
.sp{position:fixed;z-index:60;width:7px;height:7px;margin:-3px;background:#ff2a3d;box-shadow:0 0 10px 2px #e11d2e;transform:rotate(45deg);pointer-events:none}
.cg{position:fixed;z-index:4;width:260px;height:260px;margin:-130px;border-radius:50%;background:radial-gradient(#e11d2e30,transparent 65%);pointer-events:none;left:-999px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#000d;padding:8px 16px;border-radius:99px;font-size:13px;z-index:70;opacity:0;transition:.3s;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1}
/* v4 effects */
.note{position:absolute;left:84%;top:-4px;width:max-content;max-width:210px;padding:8px 13px;border-radius:16px;background:linear-gradient(135deg,#ff2a3d,#a10f1f);color:#fff;font-size:12px;font-weight:700;line-height:1.4;box-shadow:0 6px 22px #000a,0 0 18px #e11d2e66;z-index:4;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;animation:pop2 .5s both}
.note[hidden]{display:none}
@keyframes pop2{from{opacity:0;scale:.5}}
.pad>.av{animation:bob2 4s ease-in-out infinite}
@keyframes bob2{50%{translate:0 -3px}}
h1:hover{animation:gl .6s}
.card::after{content:"";position:absolute;inset:0;border-radius:20px;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),#ffffff1c,transparent 60%);pointer-events:none;z-index:2}
.frame{position:fixed;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 110px #e11d2e45,inset 0 0 0 1px #ff2a3d30;animation:beat 3.5s ease-in-out infinite}
@keyframes beat{50%{box-shadow:inset 0 0 170px #e11d2e75,inset 0 0 0 1px #ff2a3d55}}
@media (orientation:landscape){.shade::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000030 2px 3px)}.shade::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#e11d2e30,transparent 45%,#3a0a7a38);mix-blend-mode:screen}}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px;flex:none}
.eq i{width:3px;height:4px;background:var(--red);border-radius:2px;box-shadow:0 0 6px var(--red)}
.playing .eq i{animation:eq .7s infinite ease-in-out alternate}
.eq i:nth-child(2){animation-delay:.15s!important}.eq i:nth-child(3){animation-delay:.3s!important}.eq i:nth-child(4){animation-delay:.08s!important}
@keyframes eq{to{height:16px}}
.tr2{position:fixed;z-index:59;width:6px;height:6px;margin:-3px;border-radius:50%;background:#ff2a3d;box-shadow:0 0 10px #e11d2e;pointer-events:none}
/* landscape short screens */
@media (orientation:landscape) and (max-height:560px){
 .pgw{padding:62px 12px 62px}
 .card{width:min(780px,100%);display:grid;grid-template-columns:1fr 1.15fr}
 .banner{height:100%;min-height:150px;border-radius:20px 0 0 20px;background-position:22% center}
 .pad{padding:14px 16px}.pad>.av{position:absolute;left:calc(23.25% - 44px);top:calc(50% - 44px);margin:0;z-index:2}
 .cl{width:min(860px,100%);grid-template-columns:repeat(5,1fr)}
 .row{flex-direction:column;text-align:center;padding:12px 8px;gap:8px}
 .en .av{--sz:96px;margin-bottom:8px}.note{left:50%;top:-50px;transform:translateX(-50%);max-width:200px;-webkit-line-clamp:2}.en h2{font-size:26px}.en-u{margin-bottom:14px}
}
@media (max-height:640px) and (orientation:portrait){.banner{height:90px}.box{min-height:62px}.row{padding:7px 10px}.app{width:42px;height:42px}}
@media (max-width:420px){.mini{padding:0 8px;gap:5px;font-size:10px;letter-spacing:.03em}.row{gap:10px;padding:10px}}
@media (max-width:340px){.eq,.mini span,.meta span{display:none}.mini{padding:0 9px}input[type=range]{width:50px}}
</style>
</head>

 copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',open:'<path d="M7 17L17 7M9 7h8v8"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'};

function copyText(t){try{return navigator.clipboard.writeText(t)}catch(e){}const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy")}catch(e){}x.remove();return Promise.resolve()}

/* audio + sfx */
let ac,vol=.7,muted=false;
function ctx(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state=="suspended")ac.resume();return ac}
function setVol(){const v=muted?0:vol;A.volume=v;$("mb").innerHTML=ic(v?"vol":"mute",18)}
function noise(len,fn,hp,g){const c=ctx(),b=c.createBuffer(1,c.sampleRate*len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=fn(i/d.length);
 const s=c.createBufferSource(),h=c.createBiquadFilter(),l=c.createBiquadFilter(),G=c.createGain();s.buffer=b;h.type="highpass";h.frequency.value=hp;l.type="lowpass";l.frequency.value=5000;G.gain.value=g;s.connect(h).connect(l).connect(G).connect(c.destination);s.start()}
function sfxOn(){const c=ctx(),t=c.currentTime,o=c.createOscillator(),G=c.createGain();o.type="sine";o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(58,t+.3);
 G.gain.setValueAtTime(.0001,t);G.gain.exponentialRampToValueAtTime(.18,t+.03);G.gain.exponentialRampToValueAtTime(.0001,t+.4);o.connect(G).connect(c.destination);o.start(t);o.stop(t+.45);
 noise(.9,x=>(Math.random()<.01?Math.random()*2-1:(Math.random()*2-1)*.012)*Math.pow(1-x,1.6),1500,.2)}
function sfxOff(){const c=ctx(),t=c.currentTime,o=c.createOscillator(),f=c.createBiquadFilter(),G=c.createGain();o.type="triangle";f.type="lowpass";f.frequency.value=420;
 o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(48,t+.8);G.gain.setValueAtTime(.0001,t);G.gain.exponentialRampToValueAtTime(.08,t+.06);G.gain.exponentialRampToValueAtTime(.0001,t+.85);
 o.connect(f).connect(G).connect(c.destination);o.start(t);o.stop(t+.9);noise(.5,x=>(Math.random()<.008?Math.random()*2-1:0)*(1-x),1500,.12)}
function play(){ctx();setVol();sfxOn();A.play().catch(()=>toast("เล่นเพลงไม่ได้ ลองกดปุ่มเล่นอีกครั้ง"))}
function toggle(){if(A.paused)play();else{ctx();sfxOff();A.pause()}}
A.onplay=A.onpause=A.onended=()=>{const on=!A.paused;$("pb").innerHTML=ic(on?"pause":"play",18);$("pd").classList.toggle("on",on);document.querySelector(".player").classList.toggle("playing",on)};
$("pb").innerHTML=ic("play",18);$("pb").onclick=toggle;$("mb").onclick=()=>{muted=!muted;setVol()};$("vr").oninput=e=>{vol=+e.target.value;muted=false;setVol()};setVol();
A.ontimeupdate=A.onloadedmetadata=()=>{const d=A.duration||0;$("fl").style.width=d?A.currentTime/d*100+"%":"0";$("tm").textContent=fmt(A.currentTime)+" / "+fmt(d)};
const bar=$("bar");function seek(e){const r=bar.getBoundingClientRect();if(A.duration)A.currentTime=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*A.duration}
bar.onpointerdown=e=>{bar.setPointerCapture(e.pointerId);bar.classList.add("drag");seek(e)};
bar.onpointermove=e=>{if(bar.classList.contains("drag"))seek(e)};
bar.onpointerup=bar.onpointercancel=()=>bar.classList.remove("drag");

  if(u.avatar){a.dataset.set=1;a.onerror=()=>{a.onerror=null;a.src=a.dataset.fb||"cover.jpg"};a.src=`https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.${u.avatar.startsWith("a_")?"gif":"png"}?size=256`}
  f.hidden=!dec;v.classList.toggle("noframe",!dec);if(dec)f.src=`https://cdn.discordapp.com/avatar-decoration-presets/${dec.asset}.png?size=256`});
 const box=$("ac");sp=d.listening_to_spotify?d.spotify:null;

 else if(act){box.innerHTML='<div class="tx"><small>กำลังทำ</small><b></b><span></span><span></span></div>';const t=box.querySelectorAll("b,span");
  t[0].textContent=act.name;t[1].textContent=act.details||"";t[2].textContent=act.state||""}
 else{box.innerHTML='<div class="tx"><small>กิจกรรม</small><b></b><span></span></div>';box.querySelector("b").textContent=cs&&cs.state?cs.state:s=="offline"?"ตอนนี้ไม่อยู่":"ไม่ได้ทำอะไรอยู่";box.querySelector("span").textContent="ติดต่อได้ที่หน้า CONTACT"}}
function tick(){if(!sp||!$("lf"))return;const n=Date.now(),t=sp.timestamps;$("lf").textContent="จบในอีก "+fmt((t.end-n)/1000)+" นาที";$("pp").style.width=Math.min(100,(n-t.start)/(t.end-t.start)*100)+"%"}

/* trail */
let lt=0;function trail(e){const n=performance.now();if(n-lt<35)return;lt=n;const d=document.createElement("div");d.className="tr2";d.style.left=e.clientX+"px";d.style.top=e.clientY+"px";B.appendChild(d);d.animate([{transform:"scale(1)",opacity:.9},{transform:"scale(0)",opacity:0}],{duration:450}).onfinish=()=>d.remove()}
/* click fx */
document.addEventListener("pointerdown",e=>{
 for(let k=0;k<2;k++){const r=document.createElement("div");r.className="rip"+(k?" b":"");r.style.left=e.clientX+"px";r.style.top=e.clientY+"px";B.appendChild(r);setTimeout(()=>r.remove(),900)}
 for(let i=0;i<12;i++){const p=document.createElement("div"),a=Math.PI*2*i/12+Math.random()*.5,d=40+Math.random()*60;p.className="sp";p.style.left=e.clientX+"px";p.style.top=e.clientY+"px";B.appendChild(p);
  p.animate([{transform:"translate(0,0) rotate(45deg) scale(1)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(225deg) scale(0)`,opacity:0}],{duration:600+Math.random()*300,easing:"cubic-bezier(.1,.7,.3,1)"}).onfinish=()=>p.remove()}});
/* cursor glow + card tilt (mouse) + embers */
const cg=$("cg");
if(matchMedia("(hover:hover)").matches){const c=$("card");document.addEventListener("pointermove",e=>{cg.style.left=e.clientX+"px";cg.style.top=e.clientY+"px";trail(e);const rc=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-rc.left)+"px");c.style.setProperty("--my",(e.clientY-rc.top)+"px");const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;c.style.transform=`perspective(900px) rotateY(${x*8}deg) rotateX(${-y*8}deg)`})}
const fx=$("fx"),g=fx.getContext("2d");let ps=[];
function rs(){fx.width=innerWidth;fx.height=innerHeight}rs();addEventListener("resize",rs);
for(let i=0;i<45;i++)ps.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.6+Math.random()*1.8,v:.2+Math.random()*.6,w:Math.random()*6});
(function loop(t){g.clearRect(0,0,fx.width,fx.height);for(const p of ps){p.y-=p.v;p.x+=Math.sin(t/900+p.w)*.3;if(p.y<-5){p.y=fx.height+5;p.x=Math.random()*fx.width}
 g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fillStyle="rgba(255,70,85,"+(.25+.35*Math.abs(Math.sin(t/700+p.w)))+")";g.shadowColor="#e11d2e";g.shadowBlur=8;g.fill()}requestAnimationFrame(loop)})(0);
